## 8080 matches the Dockerfile's EXPOSE, the README and the bruno collection.
## A deployment sets its own port with QUARKUS_HTTP_PORT (see .env.example).
quarkus.http.port=8080
quarkus.http.root-path=/hello-gazelle-simulator

## simulator properties
version=1.0.0
instanceId=111345
replicaId=001

# Gazelle
gzl.service.name=Hello Gazelle Simulator
gzl.service.k8s.id=hello-gazelle-simulator-111345-001

## Base URL the simulation service is reachable at, announced to the service registry. The test
## environment appends /simulation/v1/... itself. Behind a reverse proxy set it to the public URL
## with SIMULATIONSERVICEURL (see .env.example).
simulationServiceUrl=http://localhost:${quarkus.http.port}${quarkus.http.root-path}

quarkus.smallrye-health.root-path=${quarkus.http.root-path}/health

## Docker inside URL of the test environment to send the service metadata to.
## The simulation report is not configured here: it goes to the callback URL the
## test environment supplies with each simulation setup request.
websocket.url.base=ws://iua-ru-mock:9090/service-registration

## URL of the test environment when running outside docker.
# websocket.url.base=ws://localhost:9090/service-registration

## required by the Gazelle simulation manager factory, which runs the simulations on a thread pool
gzl.executor.thread.pool=10
